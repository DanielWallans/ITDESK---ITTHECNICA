version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: suporte_remoto_db
    environment:
      POSTGRES_DB: suporte_remoto
      POSTGRES_USER: suporte_app
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suporte_app -d suporte_remoto"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
