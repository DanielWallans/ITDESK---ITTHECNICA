<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IT ONE" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/assets/favicon-it-one.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=2" />
    <link rel="apple-touch-icon-precomposed" href="/assets/apple-touch-icon.png?v=2" />
    <title>IT ONE — Plataforma de Gestão de Suporte | IT THECNICA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&family=Exo+2:ital,wght@0,700;0,800;1,800;1,900&family=JetBrains+Mono:wght@400;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #ffffff;
      }
      @keyframes itonePulseGlow {
        0%, 100% { opacity: 0.65; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      @keyframes itoneScanBar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Boot Loader imediato antes do React montar -->
      <div style="position:fixed;inset:0;background:#000000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow:hidden;z-index:99999;">
        <div style="position:absolute;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle, rgba(255,107,0,0.22) 0%, rgba(255,69,0,0.06) 42%, transparent 70%);filter:blur(24px);pointer-events:none;animation:itonePulseGlow 3s ease-in-out infinite;"></div>
        <img src="/assets/logo-it-one.png" alt="IT ONE — Plataforma de Gestão de Suporte" style="width:82%;max-width:360px;height:auto;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 0 28px rgba(255,107,0,0.32));" />
        <div style="margin-top:36px;width:240px;height:2px;background:#1a1a1a;position:relative;overflow:hidden;z-index:2;">
          <div style="width:45%;height:100%;background:linear-gradient(90deg, transparent, #ff6b00, #ff9442);animation:itoneScanBar 1.2s ease-in-out infinite;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
